<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Belong — Robin texts you about free things to do near you. Built for everyone." />
  <title>Belong — free events, messaged to you</title>

  <!-- Online assets: Atkinson Hyperlegible is a typeface designed by the Braille Institute for low-vision readers.
       Material Symbols gives us big, friendly, universally familiar icons. Both load free from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#chat">Skip to messages</a>

  <!-- Phone-style notification banner. When a nonprofit posts an event and its
       notice time arrives, this slides in like an incoming text message. -->
  <div class="notif" id="notif" hidden role="alert">
    <button type="button" class="notif-card" id="notifCard">
      <span class="notif-head">
        <span class="notif-avatar ms" aria-hidden="true">volunteer_activism</span>
        <span class="notif-app">Belong</span>
        <span class="notif-when" id="notifWhen">now</span>
      </span>
      <span class="notif-title" id="notifTitle"></span>
      <span class="notif-body" id="notifBody"></span>
    </button>
  </div>

  <div class="app" id="app">
    <header class="app-header">
      <div class="avatar" aria-hidden="true"><span class="ms">volunteer_activism</span></div>
      <div class="who">
        <p class="who-name">Robin</p>
        <p class="who-sub">Messages you about free events near you</p>
      </div>
      <button class="home-btn" id="startOver" type="button">
        <span class="ms" aria-hidden="true">restart_alt</span>
        <span class="home-label">Start over</span>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings" aria-haspopup="dialog">
        <span class="ms" aria-hidden="true">settings</span>
      </button>
    </header>

    <!-- Two big tabs: read Robin's messages, or manage what you've booked.
         WAI-ARIA tabs pattern: arrow keys move between tabs, panels swap below.
         (The accessibility controls that used to sit in a toolbar here now live
         behind the settings gear in the header.) -->
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab-btn" id="tabFind" type="button" role="tab" aria-selected="true" aria-controls="panelFind">
        <span class="ms" aria-hidden="true">chat</span><span class="tab-label" id="tabFindLabel">Messages</span>
      </button>
      <button class="tab-btn" id="tabBooked" type="button" role="tab" aria-selected="false" aria-controls="panelBooked" tabindex="-1">
        <span class="ms" aria-hidden="true">event_available</span><span class="tab-label" id="tabBookedLabel">My bookings</span>
        <span class="tab-badge" id="bookedBadge" hidden></span>
      </button>
    </div>

    <!-- Robin's messages. role="log" + aria-live means a screen reader speaks each new message. -->
    <div class="panel" id="panelFind" role="tabpanel" aria-labelledby="tabFind">
      <main class="chat" id="chat" role="log" aria-live="polite" aria-relevant="additions" tabindex="-1"></main>
    </div>

    <!-- Booked appointments: tap a card to select it, then the big red button cancels.
         A confirm step guards the destructive action; role="status" announces results. -->
    <div class="panel" id="panelBooked" role="tabpanel" aria-labelledby="tabBooked" hidden>
      <div class="booked-scroll">
        <h2 class="booked-title" id="bookedTitle" tabindex="-1">Your booked activities</h2>
        <p class="booked-help" id="bookedHelp"></p>
        <ul class="booked-list" id="bookedList"></ul>
        <div class="booked-empty" id="bookedEmpty" hidden>
          <img src="assets/pictograms/clock.png" alt="" />
          <p class="booked-empty-title" id="bookedEmptyText"></p>
          <p class="booked-empty-hint" id="bookedEmptyHint"></p>
        </div>
      </div>
      <div class="booked-footer">
        <p class="booked-status" id="bookedStatus" role="status"></p>
        <div class="confirm" id="confirmBox" hidden tabindex="-1">
          <p class="confirm-text" id="confirmText"></p>
          <div class="confirm-actions">
            <button type="button" class="btn danger" id="btnConfirmYes">
              <span class="ms" aria-hidden="true">check</span><span id="confirmYesLabel"></span>
            </button>
            <button type="button" class="btn" id="btnConfirmNo">
              <span class="ms" aria-hidden="true">close</span><span id="confirmNoLabel"></span>
            </button>
          </div>
        </div>
        <button type="button" class="btn-cancel" id="btnCancel" hidden>
          <span class="ms" aria-hidden="true">event_busy</span><span id="btnCancelLabel"></span>
        </button>
      </div>
    </div>

    <p class="credit">
      Symbols: <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> — Sergio Palao, Gobierno de Aragón (CC BY-NC-SA)
    </p>
  </div>

  <!-- Onboarding: a one-time, four-question tap survey (location, interests,
       age, accessibility needs) shown on first open. Robin uses the answers
       to decide which events to message the user about. Same PECS/AAC rule
       as everywhere: every option is colour + icon + word, always together. -->
  <div class="onboarding" id="onboarding" hidden>
    <div class="onb-card">
      <div class="onb-top">
        <div class="onb-progress" id="onbProgress" role="img"></div>
        <button type="button" class="onb-skip" id="onbSkip">Skip setup</button>
      </div>
      <div class="avatar avatar-lg" aria-hidden="true"><span class="ms">volunteer_activism</span></div>
      <h1 class="onb-title" id="onbTitle" tabindex="-1"></h1>
      <p class="onb-sub" id="onbSub"></p>
      <div class="onb-options" id="onbOptions"></div>
      <div class="onb-actions" id="onbActions"></div>
    </div>
  </div>

  <!-- Settings: the accessibility controls, one tap behind the gear.
       Same PECS/AAC rule as everywhere: every row is icon + word, and
       shows its current state in words too. -->
  <div class="settings" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-card">
      <div class="settings-top">
        <h2 class="settings-title" id="settingsTitle" tabindex="-1">Settings</h2>
        <button type="button" class="icon-btn" id="settingsClose" aria-label="Close settings">
          <span class="ms" aria-hidden="true">close</span>
        </button>
      </div>

      <button class="setting-row" id="btnText" type="button">
        <span class="ms" aria-hidden="true">format_size</span>
        <span class="setting-label" id="labelText">Text size</span>
        <span class="setting-value" id="valueText"></span>
      </button>
      <button class="setting-row" id="btnContrast" type="button" aria-pressed="false">
        <span class="ms" aria-hidden="true">contrast</span>
        <span class="setting-label" id="labelContrast">High contrast</span>
        <span class="setting-value" id="valueContrast"></span>
      </button>
      <button class="setting-row" id="btnSound" type="button" aria-pressed="false">
        <span class="ms" aria-hidden="true">volume_up</span>
        <span class="setting-label" id="labelSound">Read aloud</span>
        <span class="setting-value" id="valueSound"></span>
      </button>

      <p class="settings-group" id="labelLang">Language</p>
      <div class="lang-rows" role="group" aria-labelledby="labelLang">
        <button class="setting-row lang-row" type="button" data-lang="en" aria-pressed="false">
          <span class="ms" aria-hidden="true">language</span>
          <span class="setting-label">English</span>
          <span class="check ms" aria-hidden="true">check</span>
        </button>
        <button class="setting-row lang-row" type="button" data-lang="fr" aria-pressed="false">
          <span class="ms" aria-hidden="true">language</span>
          <span class="setting-label">Français</span>
          <span class="check ms" aria-hidden="true">check</span>
        </button>
        <button class="setting-row lang-row" type="button" data-lang="es" aria-pressed="false">
          <span class="ms" aria-hidden="true">language</span>
          <span class="setting-label">Español</span>
          <span class="check ms" aria-hidden="true">check</span>
        </button>
      </div>

      <a class="settings-link" id="orgLink" href="post.html">For organizations</a>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
