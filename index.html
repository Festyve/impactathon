<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Belong — a simple, spoken, texting-style way to find free things to do near you. Built for everyone." />
  <title>Belong — find things to do near you</title>

  <!-- Online assets: Atkinson Hyperlegible is a typeface designed by the Braille Institute for low-vision readers.
       Material Symbols gives us big, friendly, universally familiar icons. Both load free from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#chat">Skip to messages</a>

  <div class="app" id="app">
    <!-- Who you're talking to. A named, friendly guide reads as a person, not a database. -->
    <header class="app-header">
      <div class="avatar" aria-hidden="true"><span class="ms">volunteer_activism</span></div>
      <div class="who">
        <p class="who-name">Robin</p>
        <p class="who-sub">Finds free things near you</p>
      </div>
      <button class="home-btn" id="startOver" type="button">
        <span class="ms" aria-hidden="true">restart_alt</span>
        <span class="home-label">Start over</span>
      </button>
    </header>

    <!-- Accessibility controls, always one tap away. Each is a big, labelled target. -->
    <div class="toolbar" role="group" aria-label="Accessibility options">
      <button class="tool" id="btnText" type="button" aria-label="Make text bigger">
        <span class="ms" aria-hidden="true">format_size</span><span class="tool-label">Text size</span>
      </button>
      <button class="tool" id="btnContrast" type="button" aria-pressed="false">
        <span class="ms" aria-hidden="true">contrast</span><span class="tool-label">Contrast</span>
      </button>
      <button class="tool" id="btnSound" type="button" aria-pressed="false">
        <span class="ms" aria-hidden="true">volume_up</span><span class="tool-label">Read aloud</span>
      </button>
      <button class="tool" id="btnLang" type="button" aria-label="Change language">
        <span class="ms" aria-hidden="true">language</span><span class="tool-label" id="langLabel">English</span>
      </button>
    </div>

    <!-- Two big tabs: keep finding things, or manage what you've booked.
         WAI-ARIA tabs pattern: arrow keys move between tabs, panels swap below. -->
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab-btn" id="tabFind" type="button" role="tab" aria-selected="true" aria-controls="panelFind">
        <span class="ms" aria-hidden="true">search</span><span class="tab-label" id="tabFindLabel">Find things</span>
      </button>
      <button class="tab-btn" id="tabBooked" type="button" role="tab" aria-selected="false" aria-controls="panelBooked" tabindex="-1">
        <span class="ms" aria-hidden="true">event_available</span><span class="tab-label" id="tabBookedLabel">My bookings</span>
        <span class="tab-badge" id="bookedBadge" hidden></span>
      </button>
    </div>

    <!-- The conversation. role="log" + aria-live means a screen reader speaks each new message. -->
    <div class="panel" id="panelFind" role="tabpanel" aria-labelledby="tabFind">
      <main class="chat" id="chat" role="log" aria-live="polite" aria-relevant="additions" tabindex="-1"></main>
    </div>

    <!-- Booked appointments: tap a card to select it, then the big red button cancels.
         A confirm step guards the destructive action; role="status" announces results. -->
    <div class="panel" id="panelBooked" role="tabpanel" aria-labelledby="tabBooked" hidden>
      <div class="booked-scroll">
        <h2 class="booked-title" id="bookedTitle" tabindex="-1">Your booked activities</h2>
        <p class="booked-help" id="bookedHelp"></p>
        <ul class="booked-list" id="bookedList"></ul>
        <div class="booked-empty" id="bookedEmpty" hidden>
          <img src="assets/pictograms/clock.png" alt="" />
          <p class="booked-empty-title" id="bookedEmptyText"></p>
          <p class="booked-empty-hint" id="bookedEmptyHint"></p>
        </div>
      </div>
      <div class="booked-footer">
        <p class="booked-status" id="bookedStatus" role="status"></p>
        <div class="confirm" id="confirmBox" hidden tabindex="-1">
          <p class="confirm-text" id="confirmText"></p>
          <div class="confirm-actions">
            <button type="button" class="btn danger" id="btnConfirmYes">
              <span class="ms" aria-hidden="true">check</span><span id="confirmYesLabel"></span>
            </button>
            <button type="button" class="btn" id="btnConfirmNo">
              <span class="ms" aria-hidden="true">close</span><span id="confirmNoLabel"></span>
            </button>
          </div>
        </div>
        <button type="button" class="btn-cancel" id="btnCancel" hidden>
          <span class="ms" aria-hidden="true">event_busy</span><span id="btnCancelLabel"></span>
        </button>
      </div>
    </div>

    <p class="credit">
      Symbols: <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> — Sergio Palao, Gobierno de Aragón (CC BY-NC-SA)
      · <a href="post.html">For organizations</a>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
